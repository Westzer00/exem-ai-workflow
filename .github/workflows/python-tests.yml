name: LOOP independent example tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tests
        run: python -m pip install pytest
      - name: Test
        run: python -m pytest -q
      - name: Run example
        run: python -m backend.examples.run_demo
