name: LOOP backend and UI checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        run: python -m pip install pytest pytest-cov ruff
      - name: Static lint (undefined names and unused imports)
        run: ruff check --select F backend
      - name: Python syntax
        run: python -m compileall -q backend
      - name: LOOP and HTTP tests
        run: python -m pytest -q backend/tests/ --cov=backend --cov-report=term-missing
      - name: Run independent LOOP
        run: python -m backend.examples.run_demo
      - name: Browser JavaScript syntax
        run: node --check ui-demo/app.js
